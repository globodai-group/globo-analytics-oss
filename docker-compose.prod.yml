version: "3.8"

# Production docker-compose using pre-built Docker Hub image
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ==========================================================================
  # GloboAnalytics Application (Pre-built image)
  # ==========================================================================
  app:
    image: artik0din/globo-analytics-oss:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://globoanalytics:globoanalytics@postgres:5432/globoanalytics
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - LICENSE_KEY=${LICENSE_KEY:-}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=globoanalytics
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-globoanalytics}
      - POSTGRES_DB=globoanalytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globoanalytics -d globoanalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis Cache (Optional but recommended)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
