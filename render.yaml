# Render Blueprint
# Deploy with: https://render.com/deploy?repo=https://github.com/globodai-group/globo-analytics-oss

services:
  - type: web
    name: globo-analytics
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: globo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: globo-redis
          type: redis
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LICENSE_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

  - type: redis
    name: globo-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: globo-db
    databaseName: globoanalytics
    user: globoanalytics
    plan: free
    ipAllowList: []
