codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "tests/**/*"
  - "node_modules/**/*"
  - ".next/**/*"
  - "coverage/**/*"
  - "prisma/**/*"
  - "public/**/*"

flags:
  unittests:
    paths:
      - src/
    carryforward: true
